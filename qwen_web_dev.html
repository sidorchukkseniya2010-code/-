<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Бесплатный курс Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fira-code@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-dark:#0a0a23;
  --bg-darker:#1b1b32;
  --bg-card:#2a2a40;
  --text:#dfdfe2;
  --text-dim:#858591;
  --accent:#f1be32;
  --green:#99c9ff;
  --success:#3fb950;
  --danger:#f85149;
  --border:#3d3d5c;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg-dark);color:var(--text);overflow:hidden}
a{color:var(--green);text-decoration:none}

/* HEADER */
.header{
  height:52px;background:var(--bg-darker);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:16px;z-index:10;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text)}
.logo-icon{
  width:32px;height:32px;background:var(--accent);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--bg-dark);font-weight:900;
}
.header-nav{display:flex;gap:16px;margin-left:auto;font-size:14px}
.header-nav span{cursor:pointer;color:var(--text-dim);transition:.2s}
.header-nav span:hover{color:var(--accent)}
.progress-badge{
  background:var(--bg-card);padding:4px 12px;border-radius:20px;font-size:13px;
  color:var(--accent);border:1px solid var(--border)
}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 52px)}
.sidebar{
  width:280px;background:var(--bg-darker);border-right:1px solid var(--border);
  overflow-y:auto;flex-shrink:0;
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sidebar h3{
  padding:16px;font-size:12px;text-transform:uppercase;letter-spacing:1px;
  color:var(--text-dim);border-bottom:1px solid var(--border)
}
.lesson-item{
  padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;font-size:14px;transition:.15s;
}
.lesson-item:hover{background:var(--bg-card)}
.lesson-item.active{background:var(--bg-card);border-left:3px solid var(--accent);padding-left:13px}
.lesson-item.completed .check{color:var(--success)}
.check{width:18px;height:18px;border:2px solid var(--border);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.lesson-item.completed .check{border-color:var(--success);background:var(--success);color:#fff}
.lesson-num{color:var(--text-dim);font-size:12px;min-width:22px}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

/* HERO */
.hero{
  padding:40px 32px;background:linear-gradient(135deg,#1b1b32 0%,#2a2a40 100%);
  border-bottom:1px solid var(--border);
}
.hero h1{font-size:32px;margin-bottom:8px;color:var(--accent)}
.hero p{color:var(--text-dim);font-size:15px;max-width:700px;line-height:1.6}

/* LESSON CONTENT */
.lesson-content{padding:32px;max-width:900px;width:100%}
.lesson-content h2{color:var(--accent);margin-bottom:16px;font-size:26px}
.lesson-content h3{color:var(--green);margin:24px 0 12px;font-size:18px}
.lesson-content p{line-height:1.7;margin-bottom:14px;color:var(--text)}
.lesson-content ul,.lesson-content ol{margin:12px 0 12px 24px;line-height:1.7}
.lesson-content code{
  background:var(--bg-card);padding:2px 8px;border-radius:4px;
  font-family:'Fira Code',monospace;font-size:14px;color:var(--accent)
}
.lesson-content pre{
  background:var(--bg-darker);padding:16px;border-radius:8px;
  overflow-x:auto;margin:14px 0;border:1px solid var(--border);
}
.lesson-content pre code{background:none;padding:0;color:var(--text);font-size:14px;line-height:1.6}
.task-box{
  background:var(--bg-card);border-left:4px solid var(--accent);
  padding:16px 20px;margin:20px 0;border-radius:0 8px 8px 0;
}
.task-box strong{color:var(--accent);display:block;margin-bottom:8px}

/* EDITOR */
.editor-section{
  border-top:1px solid var(--border);background:var(--bg-darker);
  padding:20px 32px;display:flex;flex-direction:column;gap:12px;
}
.editor-header{
  display:flex;align-items:center;justify-content:space-between;
}
.editor-header h4{color:var(--text);font-size:14px;text-transform:uppercase;letter-spacing:1px}
.editor-actions{display:flex;gap:8px}
.btn{
  background:var(--accent);color:var(--bg-dark);border:none;padding:8px 18px;
  border-radius:4px;font-weight:700;cursor:pointer;font-size:14px;transition:.2s;
  font-family:inherit;
}
.btn:hover{background:#f5c842;transform:translateY(-1px)}
.btn-secondary{background:var(--bg-card);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-success{background:var(--success);color:#fff}
.editor{
  width:100%;min-height:200px;background:#0a0a23;color:var(--text);
  border:1px solid var(--border);border-radius:6px;padding:16px;
  font-family:'Fira Code',monospace;font-size:14px;line-height:1.6;
  resize:vertical;outline:none;
}
.editor:focus{border-color:var(--accent)}
.output{
  background:#000;color:#99c9ff;padding:14px;border-radius:6px;
  font-family:'Fira Code',monospace;font-size:13px;min-height:60px;
  max-height:200px;overflow-y:auto;border:1px solid var(--border);
  white-space:pre-wrap;
}
.output.error{color:var(--danger)}
.output.success{color:var(--success)}
.loading{color:var(--text-dim);font-style:italic}

/* NAV BUTTONS */
.lesson-nav{
  display:flex;justify-content:space-between;padding:20px 32px;
  border-top:1px solid var(--border);background:var(--bg-darker);
}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
  align-items:center;justify-content:center;z-index:100;
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--bg-darker);border:1px solid var(--border);border-radius:12px;
  padding:32px;max-width:500px;width:90%;text-align:center;
}
.modal h2{color:var(--accent);margin-bottom:16px}
.modal p{margin-bottom:20px;color:var(--text-dim);line-height:1.6}
.trophy{font-size:64px;margin-bottom:16px}

@media(max-width:768px){
  .sidebar{width:240px;position:absolute;left:-240px;height:100%;transition:.3s;z-index:20}
  .sidebar.open{left:0}
  .hero{padding:24px 16px}
  .lesson-content,.editor-section,.lesson-nav{padding:20px 16px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">Py</div>
    <span>PyCamp</span>
  </div>
  <div class="header-nav">
    <span onclick="showHome()">Курсы</span>
    <span onclick="alert('Добро пожаловать в PyCamp!')">О проекте</span>
    <span class="progress-badge" id="progressBadge">0 / 20</span>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>📚 Программа курса</h3>
    <div id="lessonList"></div>
  </aside>

  <main class="main" id="main">
    <!-- content injected -->
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="trophy">🏆</div>
    <h2 id="modalTitle">Поздравляем!</h2>
    <p id="modalText"></p>
    <button class="btn" onclick="closeModal()">Продолжить</button>
  </div>
</div>

<script>
// ============ PYODIDE LOADER ============
let pyodide = null;
let pyodideReady = false;
let pyodideLoading = false;

async function loadPyodideRuntime(){
  if(pyodideReady || pyodideLoading) return;
  pyodideLoading = true;
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js';
  script.onload = async () => {
    pyodide = await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/'});
    pyodideReady = true;
    document.querySelectorAll('.pyodide-status').forEach(el=>{
      el.innerHTML = '<span style="color:var(--success)">✓ Python готов к работе</span>';
    });
  };
  document.head.appendChild(script);
}

// ============ LESSONS DATA ============
const lessons = [
  {
    title:"Знакомство с Python",
    content:`
      <h2>🐍 Добро пожаловать в мир Python!</h2>
      <p>Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
      <h3>Почему Python?</h3>
      <ul>
        <li><strong>Простой синтаксис</strong> — читается почти как английский текст</li>
        <li><strong>Огромное сообщество</strong> — миллионы разработчиков по всему миру</li>
        <li><strong>Богатая экосистема</strong> — тысячи библиотек на любые задачи</li>
        <li><strong>Универсальность</strong> — от скриптов до искусственного интеллекта</li>
      </ul>
      <h3>Ваша первая программа</h3>
      <p>Традиционно изучение любого языка начинается с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — это называется <em>строка</em>.</p>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        Выведите на экран фразу: <code>Hello, PyCamp!</code>
      </div>
    `,
    starter:`# Выведите "Hello, PyCamp!"\n`,
    test:`
def check(output):
    return "Hello, PyCamp!" in output
`
  },
  {
    title:"Переменные и типы данных",
    content:`
      <h2>📦 Переменные и типы данных</h2>
      <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
      <h3>Создание переменных</h3>
      <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True</code></pre>
      <h3>Основные типы данных</h3>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"привет"</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
      </ul>
      <h3>Проверка типа</h3>
      <p>Функция <code>type()</code> возвращает тип переменной:</p>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;</code></pre>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        Создайте переменную <code>year</code> со значением <code>2026</code> и выведите её тип с помощью <code>print(type(year))</code>.
      </div>
    `,
    starter:`# Создайте переменную year = 2026\n# Выведите её тип\n`,
    test:`
def check(output):
    return "<class 'int'>" in output and "2026" not in output or "<class 'int'>" in output
`
  },
  {
    title:"Числа и арифметика",
    content:`
      <h2>🔢 Числа и арифметические операции</h2>
      <p>Python — отличный калькулятор. Поддерживаются все стандартные математические операции.</p>
      <h3>Операторы</h3>
      <pre><code>a = 10
b = 3

print(a + b)   # 13  сложение
print(a - b)   # 7   вычитание
print(a * b)   # 30  умножение
print(a / b)   # 3.333...  деление
print(a // b)  # 3   целочисленное деление
print(a % b)   # 1   остаток от деления
print(a ** b)  # 1000 возведение в степень</code></pre>
      <h3>Порядок операций</h3>
      <p>Как в математике: сначала степень, потом умножение/деление, потом сложение/вычитание. Скобки меняют порядок:</p>
      <pre><code>print(2 + 3 * 4)    # 14
print((2 + 3) * 4)  # 20</code></pre>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        Вычислите и выведите результат: <code>17</code> в степени <code>2</code>.
      </div>
    `,
    starter:`# Вычислите 17 в степени 2 и выведите результат\n`,
    test:`
def check(output):
    return "289" in output
`
  },
  {
    title:"Строки",
    content:`
      <h2>📝 Работа со строками</h2>
      <p>Строка — это последовательность символов. В Python строки неизменяемы и поддерживают множество операций.</p>
      <h3>Создание строк</h3>
      <pre><code>s1 = 'Одинарные кавычки'
s2 = "Двойные кавычки"
s3 = """Многострочная
строка"""</code></pre>
      <h3>Операции со строками</h3>
      <pre><code># Конкатенация (сложение)
print("Привет, " + "мир!")  # Привет, мир!

# Повторение
print("Ха" * 3)  # ХаХаХа

# Длина строки
print(len("Python"))  # 6</code></pre>
      <h3>Индексация и срезы</h3>
      <pre><code>s = "Python"
print(s[0])    # P (первый символ)
print(s[-1])   # n (последний)
print(s[0:3])  # Pyt (срез)</code></pre>
      <h3>f-строки (форматирование)</h3>
      <pre><code>name = "Мир"
print(f"Привет, {name}!")  # Привет, Мир!</code></pre>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        Создайте переменные <code>first = "Py"</code> и <code>second = "thon"</code>. Выведите их объединение с помощью <code>+</code>.
      </div>
    `,
    starter:`first = "Py"
second = "thon"
# Выведите объединение строк\n`,
    test:`
def check(output):
    return "Python" in output
`
  },
  {
    title:"Ввод данных",
    content:`
      <h2>⌨️ Ввод данных от пользователя</h2>
      <p>Функция <code>input()</code> позволяет получать данные от пользователя во время выполнения программы.</p>
      <pre><code>name = input("Как вас зовут? ")
print(f"Привет, {name}!")</code></pre>
      <h3>Важно: input всегда возвращает строку!</h3>
      <p>Если нужно число — преобразуйте его с помощью <code>int()</code> или <code>float()</code>:</p>
      <pre><code>age = int(input("Ваш возраст: "))
print(f"Через год вам будет {age + 1}")</code></pre>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        В нашем редакторе ввод недоступен. Вместо этого: создайте переменную <code>name</code> со значением <code>"Студент"</code> и выведите <code>Привет, Студент!</code> (используя f-строку или конкатенацию).
      </div>
    `,
    starter:`name = "Студент"
# Выведите приветствие\n`,
    test:`
def check(output):
    return "Привет, Студент!" in output
`
  },
  {
    title:"Условные конструкции",
    content:`
      <h2>🔀 Условия: if, elif, else</h2>
      <p>Условные конструкции позволяют выполнять разный код в зависимости от условий.</p>
      <h3>Базовый синтаксис</h3>
      <pre><code>age = 18

if age >= 18:
    print("Вы совершеннолетний")
else:
    print("Вы несовершеннолетний")</code></pre>
      <h3>Несколько условий</h3>
      <pre><code>score = 85

if score >= 90:
    print("Отлично")
elif score >= 70:
    print("Хорошо")
elif score >= 50:
    print("Удовлетворительно")
else:
    print("Не сдано")</code></pre>
      <h3>Операторы сравнения</h3>
      <ul>
        <li><code>==</code> равно</li>
        <li><code>!=</code> не равно</li>
        <li><code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code></li>
      </ul>
      <h3>Логические операторы</h3>
      <pre><code>if age >= 18 and has_passport:
    print("Можно путешествовать")

if is_weekend or is_holiday:
    print("Выходной!")</code></pre>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        Переменная <code>temperature = 25</code>. Если температура больше 20 — выведите <code>Тепло</code>, иначе <code>Холодно</code>.
      </div>
    `,
    starter:`temperature = 25
# Напишите условие\n`,
    test:`
def check(output):
    return "Тепло" in output
`
  },
  {
    title:"Цикл while",
    content:`
      <h2>🔁 Цикл while</h2>
      <p>Цикл <code>while</code> повторяет блок кода, пока условие истинно.</p>
      <h3>Базовый синтаксис</h3>
      <pre><code>count = 1
while count <= 5:
    print(count)
    count += 1
# Выведет: 1 2 3 4 5</code></pre>
      <h3>Бесконечный цикл и break</h3>
      <pre><code>while True:
    answer = input("Введите 'stop': ")
    if answer == "stop":
        break
print("Выход!")</code></pre>
      <h3>continue — пропуск итерации</h3>
      <pre><code>i = 0
while i < 10:
    i += 1
    if i % 2 == 0:
        continue
    print(i)  # выведет только нечётные: 1 3 5 7 9</code></pre>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        С помощью цикла <code>while</code> выведите числа от 1 до 5, каждое на новой строке.
      </div>
    `,
    starter:`# Выведите числа от 1 до 5 с помощью while\n`,
    test:`
def check(output):
    lines = [l.strip() for l in output.strip().split('\n') if l.strip()]
    return lines == ['1','2','3','4','5']
`
  },
  {
    title:"Цикл for",
    content:`
      <h2>🔄 Цикл for</h2>
      <p>Цикл <code>for</code> перебирает элементы последовательности (список, строку, диапазон).</p>
      <h3>Функция range()</h3>
      <pre><code># range(stop) - от 0 до stop-1
for i in range(5):
    print(i)  # 0 1 2 3 4

# range(start, stop)
for i in range(1, 6):
    print(i)  # 1 2 3 4 5

# range(start, stop, step)
for i in range(0, 10, 2):
    print(i)  # 0 2 4 6 8</code></pre>
      <h3>Перебор строки</h3>
      <pre><code>for char in "Python":
    print(char)</code></pre>
      <h3>Цикл с else</h3>
      <p>Блок <code>else</code> выполняется, если цикл завершился естественно (без <code>break</code>):</p>
      <pre><code>for i in range(5):
    if i == 10:
        break
else:
    print("Цикл завершён без break")</code></pre>
      <div class="task-box">
        <strong>🎯 Задание</strong>
        Выведите квадраты чисел от 1 до 5 (каждый на новой строке): <code>1, 4, 9, 16, 25</code>.
      </div>
    `,
    starter:`# Выведите квадраты чисел от 1 до 5\n`,
    test:`
def check(output):
    lines = [l.strip() for l in output.strip().split('\n') if l.strip()]
    return lines == ['1','4','9','16','25']
`
  },
  {
    title:"Списки",
    content:`
      <h2>📋 Списки (list)</h2>
      <p>Список — упорядоченная изменяемая коллекция элементов любых типов.</p>
      <h3>Создание и доступ</h3>
      <pre><code>fruits = ["яблоко", "банан", "вишня"]
print(fruits[0])    # яблоко

// ============ STATE ============
let currentLesson = 0;
let completed = JSON.parse(localStorage.getItem('pycamp_completed') || '[]');

// ============ RENDER ============
function renderSidebar(){
  const list = document.getElementById('lessonList');
  list.innerHTML = lessons.map((l,i)=>`
    <div class="lesson-item ${i===currentLesson?'active':''} ${completed.includes(i)?'completed':''}" onclick="loadLesson(${i})">
      <div class="check">${completed.includes(i)?'✓':(i+1)}</div>
      <div>
        <div class="lesson-num">Урок ${i+1}</div>
        <div>${l.title}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('progressBadge').textContent = `${completed.length} / ${lessons.length}`;
}

function loadLesson(idx){
  currentLesson = idx;
  const lesson = lessons[idx];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="hero">
      <h1>Урок ${idx+1}: ${lesson.title}</h1>
      <p>Прогресс: ${completed.length} из ${lessons.length} уроков завершено</p>
      <p class="pyodide-status" style="margin-top:10px;font-size:13px">
        ${pyodideReady ? '<span style="color:var(--success)">✓ Python готов к работе</span>' : '<span class="loading">⏳ Загрузка интерпретатора Python...</span>'}
      </p>
    </div>
    <div class="lesson-content">${lesson.content}</div>
    <div class="editor-section">
      <div class="editor-header">
        <h4>💻 Редактор кода</h4>
        <div class="editor-actions">
          <button class="btn btn-secondary" onclick="resetCode()">Сбросить</button>
          <button class="btn" onclick="runCode()">▶ Запустить</button>
          <button class="btn btn-success" onclick="checkTask()">✓ Проверить</button>
        </div>
      </div>
      <textarea class="editor" id="codeEditor" spellcheck="false">${lesson.starter}</textarea>
      <div class="output" id="output">// Здесь появится вывод программы</div>
    </div>
    <div class="lesson-nav">
      <button class="btn btn-secondary" onclick="prevLesson()" ${idx===0?'disabled style="opacity:.5"':''}>← Предыдущий</button>
      <button class="btn" onclick="nextLesson()" ${idx===lessons.length-1?'disabled style="opacity:.5"':''}>Следующий →</button>
    </div>
  `;
  renderSidebar();
  main.scrollTop = 0;
  loadPyodideRuntime();
}

}

// ============ ACTIONS ============
function resetCode(){
  document.getElementById('codeEditor').value = lessons[currentLesson].starter;
  document.getElementById('output').textContent = '// Здесь появится вывод программы';
  document.getElementById('output').className = 'output';
}

async function runCode(){
  const code = document.getElementById('codeEditor').value;
  const output = document.getElementById('output');
  output.className = 'output';
  
  if(!pyodideReady){
    output.innerHTML = '<span class="loading">⏳ Python ещё загружается, подождите...</span>';
    return;
  }
  
  output.textContent = '⏳ Выполнение...';
  
  try {
    // Capture stdout
    pyodide.runPython(`
import sys
from io import StringIO
_stdout_capture = StringIO()
sys.stdout = _stdout_capture
sys.stderr = _stdout_capture
`);
    
    await pyodide.runPythonAsync(code);
    
    const result = pyodide.runPython(`
_stdout_capture.seek(0)
_stdout_capture.read()
`);
    
    pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    
    output.textContent = result || '(программа выполнена без вывода)';
  } catch(err){
    output.textContent = '❌ Ошибка: ' + (err.message || err);
    output.className = 'output error';
    try{
      pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    }catch(e){}
  }
}

async function checkTask(){
  const code = document.getElementById('codeEditor').value;
  const output = document.getElementById('output');
  const lesson = lessons[currentLesson];
  
  if(!pyodideReady){
    output.innerHTML = '<span class="loading">⏳ Python ещё загружается, подождите...</span>';
    return;
  }
  
  output.textContent = '⏳ Проверка...';
  output.className = 'output';
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
_stdout_capture = StringIO()
sys.stdout = _stdout_capture
sys.stderr = _stdout_capture
`);
    
    await pyodide.runPythonAsync(code);
    
    const result = pyodide.runPython(`
_stdout_capture.seek(0)
_stdout_capture.read()
`);
    
    pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    
    // Run test
    pyodide.runPython(lesson.test);
    const passed = pyodide.runPython(`check(${JSON.stringify(result)})`);
    
    if(passed){
      output.textContent = '✅ Отлично! Задание выполнено верно!\n\nВывод вашей программы:\n' + (result || '(пусто)');
      output.className = 'output success';
      
      if(!completed.includes(currentLesson)){
        completed.push(currentLesson);
        localStorage.setItem('pycamp_completed', JSON.stringify(completed));
        renderSidebar();
        
        if(completed.length === lessons.length){
          setTimeout(()=>{
            document.getElementById('modalTitle').textContent = '🎉 Курс пройден!';
            document.getElementById('modalText').textContent = 'Поздравляем! Вы прошли все 20 уроков курса Python. Вы изучили основы синтаксиса, структуры данных, функции и объектно-ориентированное программирование. Продолжайте практиковаться!';
            document.getElementById('modal').classList.add('active');
          }, 500);
        } else if(completed.length % 5 === 0){
          setTimeout(()=>{
            document.getElementById('modalTitle').textContent = `🌟 Прогресс: ${completed.length}/${lessons.length}`;
            document.getElementById('modalText').textContent = `Отличная работа! Вы прошли уже ${completed.length} уроков. Продолжайте в том же духе!`;
            document.getElementById('modal').classList.add('active');
          }, 500);
        }
      }
    } else {
      output.textContent = '❌ Пока не совсем верно. Проверьте условие задания.\n\nВаш вывод:\n' + (result || '(пусто)');
      output.className = 'output error';
    }
  } catch(err){
    output.textContent = '❌ Ошибка выполнения: ' + (err.message || err);
    output.className = 'output error';
    try{
      pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    }catch(e){}
  }
}

function closeModal(){
  document.getElementById('modal').classList.remove('active');
}

function prevLesson(){
  if(currentLesson > 0) loadLesson(currentLesson - 1);
}

function nextLesson(){
  if(currentLesson < lessons.length - 1) loadLesson(currentLesson + 1);
}

// ============ INIT ============
renderSidebar();
showHome();
loadPyodideRuntime();

// Keyboard shortcut: Ctrl+Enter to run
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault();
    if(document.getElementById('codeEditor')) runCode();
  }
});
</script>
