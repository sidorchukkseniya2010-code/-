<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg-light: #1b1b32;
    --bg-lighter: #2a2a45;
    --text: #dfdfe2;
    --text-dim: #a0a0b0;
    --accent: #00752a;
    --accent-light: #acd157;
    --accent-hover: #008030;
    --border: #3b3b4f;
    --success: #00752a;
    --error: #c0392b;
    --warning: #f39c12;
  }
  body {
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    background: var(--bg-light);
    border-bottom: 2px solid var(--accent);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--accent-light);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
  }
  .nav-stats {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 0.9rem;
  }
  .stat-badge {
    background: var(--bg-lighter);
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .stat-badge span { color: var(--accent-light); font-weight: bold; }

  .container {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: calc(100vh - 60px);
  }
  .sidebar {
    background: var(--bg-light);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
  }
  .sidebar h3 {
    padding: 16px;
    font-size: 1rem;
    color: var(--accent-light);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-light);
  }
  .lesson-list { list-style: none; }
  .lesson-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
  }
  .lesson-item:hover { background: var(--bg-lighter); }
  .lesson-item.active {
    background: var(--bg-lighter);
    border-left: 3px solid var(--accent-light);
    padding-left: 13px;
  }
  .lesson-item.completed::before {
    content: "✓";
    color: var(--accent-light);
    font-weight: bold;
    width: 20px;
  }
  .lesson-item:not(.completed)::before {
    content: "○";
    color: var(--text-dim);
    width: 20px;
  }

  .main {
    padding: 30px 40px;
    max-width: 100%;
    overflow-y: auto;
  }
  .lesson-header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }
  .lesson-header h1 {
    color: var(--accent-light);
    font-size: 1.8rem;
    margin-bottom: 8px;
  }
  .lesson-meta {
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .lesson-content {
    line-height: 1.7;
    font-size: 1rem;
    max-width: 900px;
  }
  .lesson-content h2 {
    color: var(--accent-light);
    margin: 24px 0 12px;
    font-size: 1.3rem;
  }
  .lesson-content h3 {
    color: var(--text);
    margin: 18px 0 10px;
    font-size: 1.1rem;
  }
  .lesson-content p { margin: 10px 0; }
  .lesson-content ul, .lesson-content ol {
    margin: 10px 0 10px 24px;
  }
  .lesson-content li { margin: 6px 0; }
  .lesson-content code {
    background: var(--bg-lighter);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--accent-light);
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.9em;
  }
  .lesson-content pre {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    overflow-x: auto;
    margin: 14px 0;
  }
  .lesson-content pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
  }
  .info-box {
    background: rgba(0, 117, 42, 0.1);
    border-left: 4px solid var(--accent-light);
    padding: 12px 16px;
    margin: 14px 0;
    border-radius: 4px;
  }
  .warning-box {
    background: rgba(243, 156, 18, 0.1);
    border-left: 4px solid var(--warning);
    padding: 12px 16px;
    margin: 14px 0;
    border-radius: 4px;
  }

  .task-section {
    margin-top: 30px;
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .task-section h2 {
    color: var(--accent-light);
    margin-bottom: 12px;
  }
  .task-description {
    background: var(--bg-lighter);
    padding: 14px;
    border-radius: 6px;
    margin: 12px 0;
    border-left: 3px solid var(--accent-light);
  }
  .task-tests {
    margin-top: 14px;
  }
  .task-tests h3 {
    margin-bottom: 8px;
    font-size: 1rem;
  }
  .test-item {
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 0.85rem;
    background: var(--bg-lighter);
    border: 1px solid var(--border);
  }
  .test-item.pass { border-color: var(--success); color: var(--accent-light); }
  .test-item.fail { border-color: var(--error); }
  .test-item.pending { color: var(--text-dim); }

  .editor-section {
    margin-top: 24px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .editor-toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--bg-lighter);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }
  .btn-success { background: var(--success); }
  .btn-success:hover { background: #008a32; }

  .editor-wrapper {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .editor {
    width: 100%;
    min-height: 260px;
    background: #1e1e1e;
    color: #d4d4d4;
    border: none;
    padding: 14px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.95rem;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }
  .console {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    min-height: 100px;
    max-height: 260px;
    overflow-y: auto;
    font-family: 'Consolas', monospace;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }
  .console-output { color: #d4d4d4; }
  .console-error { color: #ff6b6b; }
  .console-info { color: var(--accent-light); }

  .progress-bar {
    width: 100%;
    height: 8px;
    background: var(--bg-lighter);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 12px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent-light);
    transition: width 0.4s;
  }

  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    flex-direction: column;
    gap: 20px;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid var(--border);
    border-top-color: var(--accent-light);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .loading-progress {
    width: 300px;
    height: 6px;
    background: var(--bg-lighter);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
  }
  .loading-progress-fill {
    height: 100%;
    background: var(--accent-light);
    width: 0%;
    transition: width 0.3s;
  }

  .certificate-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .certificate-modal.active { display: flex; }
  .certificate {
    background: linear-gradient(135deg, #1b1b32, #2a2a45);
    border: 3px solid var(--accent-light);
    border-radius: 12px;
    padding: 40px;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 0 40px rgba(172, 209, 87, 0.3);
  }
  .certificate h1 {
    color: var(--accent-light);
    font-size: 2rem;
    margin-bottom: 20px;
  }
  .certificate p { margin: 10px 0; font-size: 1.1rem; }
  .certificate .seal {
    font-size: 4rem;
    margin: 20px 0;
  }

  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    .sidebar {
      position: relative;
      top: 0;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .main { padding: 20px; }
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.95rem;
    border-bottom: 2px solid transparent;
  }
  .tab.active {
    color: var(--accent-light);
    border-bottom-color: var(--accent-light);
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div>Загружаем Python-интерпретатор...</div>
  <div class="loading-progress">
    <div class="loading-progress-fill" id="loadingProgress"></div>
  </div>
  <div style="font-size: 0.85rem; color: var(--text-dim);" id="loadingStatus">Инициализация...</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">🐍</div>
    <div>PyCamp</div>
  </div>
  <div class="nav-stats">
    <div class="stat-badge">Прогресс: <span id="progressText">0/20</span></div>
    <div class="stat-badge">🏆 <span id="certStatus">Сертификат</span></div>
  </div>
</header>

<div class="container">
  <aside class="sidebar">
    <h3>📚 Программа курса</h3>
    <ul class="lesson-list" id="lessonList"></ul>
  </aside>

  <main class="main" id="mainContent">
    <!-- Контент урока загружается динамически -->
  </main>
</div>

<div class="certificate-modal" id="certModal">
  <div class="certificate">
    <div class="seal">🏆</div>
    <h1>Сертификат PyCamp</h1>
    <p>Настоящим подтверждается, что</p>
    <h2 id="certName" style="color: var(--accent-light); margin: 20px 0;">Студент</h2>
    <p>успешно завершил(а) полный курс</p>
    <p><strong>«Python с нуля до уверенного уровня»</strong></p>
    <p style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem;">
      Выдан: <span id="certDate"></span>
    </p>
    <button class="btn btn-success" style="margin-top: 20px;" onclick="document.getElementById('certModal').classList.remove('active')">
      Закрыть
    </button>
  </div>
</div>

<script>
// ============================================================
// ДАННЫЕ КУРСА
// ============================================================
const lessons = [
  {
    id: 1,
    title: "Введение в Python",
    category: "Основы",
    content: `
      <h2>Добро пожаловать в мир Python!</h2>
      <p>Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
      
      <h3>Почему Python?</h3>
      <ul>
        <li><strong>Простой синтаксис</strong> — код читается почти как английский текст</li>
        <li><strong>Огромное сообщество</strong> — миллионы разработчиков по всему миру</li>
        <li><strong>Богатая стандартная библиотека</strong> — всё необходимое уже есть</li>
        <li><strong>Кроссплатформенность</strong> — работает на Windows, macOS, Linux</li>
      </ul>

      <h3>Ваша первая программа</h3>
      <p>Традиционно изучение любого языка начинают с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      
      <div class="info-box">
        💡 <strong>Функция <code>print()</code></strong> выводит текст на экран. Текст (строка) заключается в кавычки — одинарные <code>'</code> или двойные <code>"</code>.
      </div>

      <h3>Комментарии</h3>
      <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают другим (и вам самим в будущем) понять, что делает код.</p>
      <pre><code># Это однострочный комментарий
print("Привет")  # Комментарий после кода

"""
Это
многострочный
комментарий
"""</code></pre>
    `,
    task: "Напишите программу, которая выводит на экран текст <code>Hello, PyCamp!</code> (именно так, с восклицательным знаком).",
    initialCode: '# Напишите ваш код здесь\n',
    tests: [
      { desc: "Программа выводит 'Hello, PyCamp!'", check: (output) => output.trim() === "Hello, PyCamp!" }
    ]
  },
  {
    id: 2,
    title: "Переменные и типы данных",
    category: "Основы",
    content: `
      <h2>Переменные</h2>
      <p>Переменная — это именованная область памяти, которая хранит значение. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
      <pre><code>name = "Алиса"      # строка (str)
age = 25            # целое число (int)
height = 1.68       # дробное число (float)
is_student = True   # логический тип (bool)</code></pre>

      <h3>Правила именования переменных</h3>
      <ul>
        <li>Имя может содержать буквы, цифры и символ подчёркивания <code>_</code></li>
        <li>Не может начинаться с цифры</li>
        <li>Регистр имеет значение: <code>age</code> и <code>Age</code> — разные переменные</li>
        <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
      </ul>

      <h3>Основные типы данных</h3>
      <ul>
        <li><strong>int</strong> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><strong>float</strong> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><strong>str</strong> — строки: <code>"Привет"</code>, <code>'Python'</code></li>
        <li><strong>bool</strong> — логический тип: <code>True</code> или <code>False</code></li>
        <li><strong>NoneType</strong> — специальное значение <code>None</code> (отсутствие значения)</li>
      </ul>

      <h3>Функция type()</h3>
      <p>Чтобы узнать тип переменной, используйте функцию <code>type()</code>:</p>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;</code></pre>

      <div class="warning-box">
        ⚠️ <strong>Важно:</strong> Python — язык с динамической типизацией. Вы можете присвоить переменной значение другого типа: <code>x = 5</code>, а затем <code>x = "пять"</code>.
      </div>
    `,
    task: "Создайте три переменные: <code>name</code> со значением <code>\"Python\"</code>, <code>version</code> со значением <code>3</code> и <code>is_fun</code> со значением <code>True</code>. Выведите их значения функцией <code>print()</code> — каждое на отдельной строке.",
    initialCode: '# Создайте переменные и выведите их\n',
    tests: [
      { desc: "Переменная name существует и равна 'Python'", check: (_, vars) => vars.name === "Python" },
      { desc: "Переменная version равна 3", check: (_, vars) => vars.version === 3 },
      { desc: "Переменная is_fun равна True", check: (_, vars) => vars.is_fun === true },
      { desc: "Вывод содержит 'Python', '3' и 'True'", check: (output) => output.includes("Python") && output.includes("3") && output.includes("True") }
    ]
  },
  {
    id: 3,
    title: "Операторы",
    category: "Основы",
    content: `
      <h2>Арифметические операторы</h2>
      <pre><code>a = 10
b = 3

print(a + b)   # 13  — сложение
print(a - b)   # 7   — вычитание
print(a * b)   # 30  — умножение
print(a / b)   # 3.333... — деление (всегда float)
print(a // b)  # 3   — целочисленное деление
print(a % b)   # 1   — остаток от деления
print(a ** b)  # 1000 — возведение в степень</code></pre>

      <h3>Операторы сравнения</h3>
      <pre><code>x = 5
print(x == 5)   # True  — равно
print(x != 5)   # False — не равно
print(x > 3)    # True  — больше
print(x < 3)    # False — меньше
print(x >= 5)   # True  — больше или равно
print(x <= 4)   # False — меньше или равно</code></pre>

      <h3>Логические операторы</h3>
      <pre><code>a = True
b = False

print(a and b)  # False — И
print(a or b)   # True  — ИЛИ
print(not a)    # False — НЕ</code></pre>

      <h3>Операторы присваивания</h3>
      <pre><code>x = 10
x += 5   # x = x + 5  → 15
x -= 3   # x = x - 3  → 12
x *= 2   # x = x * 2  → 24
x /= 4   # x = x / 4  → 6.0</code></pre>

      <div class="info-box">
        💡 <strong>Приоритет операций:</strong> как в математике — сначала <code>**</code>, затем <code>* / // %</code>, затем <code>+ -</code>. Используйте скобки для изменения порядка.
      </div>
    `,
    task: "Вычислите и выведите на отдельных строках: сумму 17 и 25, произведение 6 и 7, остаток от деления 17 на 5, и 2 в степени 10.",
    initialCode: '# Вычислите и выведите результаты\n',
    tests: [
      { desc: "Вывод содержит 42 (сумма 17+25)", check: (o) => o.split('\n').some(l => l.trim() === '42') },
      { desc: "Вывод содержит 42 (произведение 6*7)", check: (o) => o.split('\n').filter(l => l.trim() === '42').length >= 2 },
      { desc: "Вывод содержит 2 (остаток 17%5)", check: (o) => o.split('\n').some(l => l.trim() === '2') },
      { desc: "Вывод содержит 1024 (2^10)", check: (o) => o.split('\n').some(l => l.trim() === '1024') }
    ]
  },
  {
    id: 4,
    title: "Строки",
    category: "Основы",
    content: `
      <h2>Работа со строками</h2>
      <p>Строка — это последовательность символов. В Python строки неизменяемы.</p>
      <pre><code>s = "Python"
print(s[0])      # P — первый символ
print(s[-1])     # n — последний символ
print(s[0:3])    # Pyt — срез с 0 по 2
print(len(s))    # 6 — длина строки</code></pre>

      <h3>Методы строк</h3>
      <pre><code>s = "Hello, World!"

print(s.upper())        # HELLO, WORLD!
print(s.lower())        # hello, world!
print(s.title())        # Hello, World!
print(s.replace("World", "Python"))  # Hello, Python!

      <h3>Декораторы с аргументами</h3>
      <pre><code>def repeat(n):
    def decorator(func):
        def wrapper(*args, **kwargs):
            for _ in range(n):
                func(*args, **kwargs)
        return wrapper
    return decorator

@repeat(3)
def greet(name):

      <h3>Практический пример: таймер</h3>
      <pre><code>import time

def timer(func):
    def wrapper(*args, **kwargs):
        start = time.time()
        result = func(*args, **kwargs)
        end = time.time()
        print(f"{func.__name__} выполнилась за {end-start:.4f} сек")
        return result
    return wrapper

@timer
def slow_function():
    time.sleep(1)
    return 42</code></pre>

        return cache[args]
    return wrapper

@memoize
def fibonacci(n):

        return n
    return fibonacci(n-1) + fibonacci(n-2)</code></pre>

      <pre><code>def count_up_to(n):

      <h3>Преимущества генераторов</h3>
      <ul>
        <li><strong>Экономия памяти</strong> — значения создаются по одному</li>
        <li><strong>Бесконечные последовательности</strong></li>
        <li><strong>Ленивые вычисления</strong></li>
      </ul>

      <pre><code># Бесконечный генератор
def infinite_sequence():
    num = 0
    while True:
        yield num
        num += 1

gen = infinite_sequence()

      <h3>yield from</h3>
      <pre><code>def flatten(nested_list):
    for item in nested_list:
        if isinstance(item, list):
            yield from flatten(item)

    def __init__(self, low, high):

      <h2>Модуль re</h2>
      <p>Регулярные выражения — мощный инструмент для поиска и обработки текста.</p>
      <pre><code>import re

text = "Мой телефон: 8-900-123-45-67, email: test@mail.ru"

# Поиск
match = re.search(r'\d{3}-\d{3}-\d{2}-\d{2}', text)
if match:

# Поиск всех совпадений

      <h3>Основные шаблоны</h3>
      <ul>
        <li><code>\d</code> — цифра, <code>\D</code> — не цифра</li>
        <li><code>\w</code> — буква/цифра/<code>_</code>, <code>\W</code> — наоборот</li>
        <li><code>\s</code> — пробел, <code>\S</code> — не пробел</li>
        <li><code>.</code> — любой символ (кроме \n)</li>
        <li><code>^</code> — начало строки, <code>$</code> — конец</li>
        <li><code>*</code> — 0 или более, <code>+</code> — 1 или более</li>
        <li><code>?</code> — 0 или 1, <code>{n}</code> — ровно n</li>
        <li><code>{n,m}</code> — от n до m</li>
        <li><code>[abc]</code> — один из символов, <code>[^abc]</code> — кроме</li>
        <li><code>()</code> — группа (захват)</li>
      </ul>

      <h3>Замена и разделение</h3>
      <pre><code>text = "Кот съел 5 мышей и 3 рыбы"

# Замена
cleaned = re.sub(r'\d+', 'N', text)
print(cleaned)  # Кот съел N мышей и N рыбы

# Разделение

print(parts)  # ['один', 'два', 'три']

# Проверка совпадения
if re.match(r'^\d+$', "12345"):
    print("Только цифры")</code></pre>

      <h3>Группы</h3>
      <pre><code>date = "2024-10-11"
match = re.match(r'(\d{4})-(\d{2})-(\d{2})', date)
if match:
    year, month, day = match.groups()
    print(f"Год: {year}, месяц: {month}, день: {day}")</code></pre>

      <div class="info-box">
        💡 Используйте сырые строки <code>r"..."</code> для регулярных выражений, чтобы не экранировать обратные слеши.
      </div>
    `,
    task: "Напишите функцию <code>extract_emails(text)</code>, которая извлекает все email-адреса из текста и возвращает их списком. Проверьте на строке <code>\"Контакты: alice@mail.ru, bob@gmail.com, invalid@, test@test.org\"</code> и выведите результат.",
    initialCode: 'import re\n\ndef extract_emails(text):\n    # Ваш код\n    pass\n\ntext = "Контакты: alice@mail.ru, bob@gmail.com, invalid@, test@test.org"\nprint(extract_emails(text))\n',
    tests: [
      { desc: "Находит alice@mail.ru, bob@gmail.com, test@test.org", check: (o) => o.includes("alice@mail.ru") && o.includes("bob@gmail.com") && o.includes("test@test.org") },
      { desc: "Не включает 'invalid@'", check: (o) => !o.includes("invalid@,") && !o.includes("'invalid@'") && !o.includes('"invalid@"') },
      { desc: "Используется re", check: (_, __, c) => c.includes('import re') }
    ]
  },
  {
    id: 20,
    title: "Финальный проект: Анализ данных",
    category: "Проект",
    content: `
      <h2>Поздравляем! Финальный проект</h2>
      <p>Вы прошли весь курс! Теперь применим все полученные знания в небольшом проекте.</p>

      <h3>Задача</h3>
      <p>Напишите программу для анализа списка оценок студентов. Программа должна:</p>
      <ul>
        <li>Принимать список оценок</li>
        <li>Вычислять среднюю оценку</li>
        <li>Находить максимальную и минимальную оценку</li>
        <li>Определять количество сдавших (оценка ≥ 60)</li>

      <h3>Подсказки</h3>
      <pre><code># Используйте:
# - функции

        raise ValueError("Список оценок пуст")

    pass</code></pre>

      <h3>Что вы изучили</h3>
      <ul>
        <li>✅ Основы синтаксиса Python</li>
        <li>✅ Переменные и типы данных</li>
        <li>✅ Операторы и выражения</li>
        <li>✅ Строки и их методы</li>
        <li>✅ Условные конструкции</li>
        <li>✅ Циклы for и while</li>
        <li>✅ Списки, словари, множества, кортежи</li>
        <li>✅ Функции и лямбды</li>
        <li>✅ Обработка ошибок</li>
        <li>✅ Объектно-ориентированное программирование</li>
        <li>✅ Модули и импорты</li>
        <li>✅ Декораторы и генераторы</li>
        <li>✅ Регулярные выражения</li>
      </ul>

      <div class="info-box">
        🎓 <strong>После завершения этого урока</strong> вы получите сертификат PyCamp! Продолжайте практиковаться — решайте задачи, делайте проекты, читайте чужой код.
      </div>
    `,
    task: "Напишите функцию <code>analyze_grades(grades)</code>, которая возвращает словарь с ключами: <code>\"average\"</code> (среднее, округлённое до 2 знаков), <code>\"max\"</code>, <code>\"min\"</code>, <code>\"passed\"</code> (количество оценок ≥ 60). Выведите результат для <code>[85, 42, 91, 67, 58, 73, 95]</code>.",
    initialCode: 'def analyze_grades(grades):\n    # Ваш код\n    pass\n\ngrades = [85, 42, 91, 67, 58, 73, 95]\nresult = analyze_grades(grades)\nfor key, value in result.items():\n    print(f"{key}: {value}")\n',
    tests: [
      { desc: "Среднее ≈ 73.0", check: (o) => o.includes("average: 73.0") },
      { desc: "Максимум = 95", check: (o) => o.includes("max: 95") },
      { desc: "Минимум = 42", check: (o) => o.includes("min: 42") },
      { desc: "Сдали (≥60) = 5", check: (o) => o.includes("passed: 5") }
    ]
  }
];

// ============================================================
// СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ============================================================
let pyodide = null;
let currentLessonId = 1;
let completedLessons = new Set();
let currentOutput = "";
let currentVars = {};
let currentCode = "";

// Загрузка прогресса
function loadProgress() {
  try {
    const saved = localStorage.getItem('pycamp_progress');
    if (saved) {
      completedLessons = new Set(JSON.parse(saved));
    }
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem('pycamp_progress', JSON.stringify([...completedLessons]));
  } catch(e) {}
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ PYODIDE С ИНДИКАТОРОМ ПРОГРЕССА
// ============================================================
async function initPyodide() {
  const progressBar = document.getElementById('loadingProgress');
  const statusText = document.getElementById('loadingStatus');
  
  try {
    statusText.textContent = 'Загрузка Pyodide...';
    progressBar.style.width = '20%';
    
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
    });
    
    progressBar.style.width = '60%';
    statusText.textContent = 'Настройка интерпретатора...';
    
    // Перехватываем вывод print()
    pyodide.setStdout({ batched: (text) => { currentOutput += text + "\n"; }});
    pyodide.setStderr({ batched: (text) => { currentOutput += "Ошибка: " + text + "\n"; }});
    
    progressBar.style.width = '100%';
    statusText.textContent = 'Готово!';
    
    setTimeout(() => {
      document.getElementById('loadingOverlay').style.display = 'none';
      renderSidebar();
      loadLesson(1);
    }, 500);
    
  } catch(e) {
    document.getElementById('loadingOverlay').innerHTML = 
      `<div style="color: #ff6b6b; text-align: center; padding: 20px;">
        <h2>Ошибка загрузки Python</h2>
        <p>${e.message}</p>
        <p style="margin-top: 20px;">Проверьте подключение к интернету и обновите страницу.</p>
        <button class="btn" onclick="location.reload()" style="margin-top: 20px;">Попробовать снова</button>
      </div>`;
  }
}

// ============================================================
// РЕНДЕРИНГ
// ============================================================
function renderSidebar() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  let lastCat = "";
  
  lessons.forEach(lesson => {
    if (lesson.category !== lastCat) {
      const catHeader = document.createElement('li');
      catHeader.style.cssText = 'padding: 10px 16px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; background: var(--bg); border-bottom: 1px solid var(--border);';
      catHeader.textContent = lesson.category;
      list.appendChild(catHeader);
      lastCat = lesson.category;
    }
    
    const li = document.createElement('li');
    li.className = 'lesson-item';
    if (completedLessons.has(lesson.id)) li.classList.add('completed');
    if (lesson.id === currentLessonId) li.classList.add('active');
    li.innerHTML = `<span>${lesson.id}. ${lesson.title}</span>`;
    li.onclick = () => loadLesson(lesson.id);
    list.appendChild(li);
  });
  
  updateProgress();
}

function updateProgress() {
  const total = lessons.length;
  const done = completedLessons.size;
  document.getElementById('progressText').textContent = `${done}/${total}`;
  
  if (done === total) {
    document.getElementById('certStatus').textContent = '🎓 Получить';
    document.getElementById('certStatus').style.cursor = 'pointer';
    document.getElementById('certStatus').onclick = showCertificate;
  }
}

function loadLesson(id) {
  currentLessonId = id;
  const lesson = lessons.find(l => l.id === id);
  if (!lesson) return;
  
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="lesson-header">
      <h1>${lesson.id}. ${lesson.title}</h1>
      <div class="lesson-meta">
        Раздел: ${lesson.category} · Урок ${lesson.id} из ${lessons.length}
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${(completedLessons.size / lessons.length) * 100}%"></div>
        </div>
      </div>
    </div>
    
    <div class="lesson-content">
      ${lesson.content}
    </div>
    
    <div class="task-section">
      <h2>🎯 Задание</h2>
      <div class="task-description">${lesson.task}</div>
      
      <div class="editor-section">
        <div class="editor-toolbar">
          <button class="btn btn-success" onclick="runCode()">▶ Запустить код</button>
          <button class="btn" onclick="checkSolution()">✓ Проверить решение</button>
          <button class="btn btn-secondary" onclick="resetCode()">↺ Сбросить</button>
          <button class="btn btn-secondary" onclick="showHint()">💡 Подсказка</button>
          ${id < lessons.length ? `<button class="btn btn-secondary" onclick="loadLesson(${id + 1})">Следующий урок →</button>` : ''}
        </div>
        
        <div class="editor-wrapper">
          <textarea class="editor" id="codeEditor" spellcheck="false">${lesson.initialCode}</textarea>
        </div>
        
        <div class="console" id="console">
          <div class="console-info">Нажмите "Запустить код", чтобы увидеть результат</div>
        </div>
        
        <div class="task-tests" id="testsSection">
          <h3>Требования к решению:</h3>
          <div id="testsList">
            ${lesson.tests.map(t => `<div class="test-item pending">○ ${t.desc}</div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
  
  renderSidebar();
  main.scrollTop = 0;
  window.scrollTo(0, 0);
}

// ============================================================
// ВЫПОЛНЕНИЕ КОДА
// ============================================================
async function runCode() {
  const editor = document.getElementById('codeEditor');
  const consoleEl = document.getElementById('console');
  const code = editor.value;
  
  consoleEl.innerHTML = '<div class="console-info">⏳ Выполняется...</div>';
  currentOutput = "";
  currentVars = {};
  currentCode = code;
  
  try {
    // Выполняем код
    await pyodide.runPythonAsync(code);
    
    // Пытаемся получить переменные
    try {
      const vars = await pyodide.runPythonAsync(`
import json
_locals = {k: v for k, v in locals().items() if not k.startswith('_')}
# Преобразуем в JSON-совместимый формат
def to_json_safe(obj):
    if isinstance(obj, (int, float, str, bool)) or obj is None:
        return obj
    if isinstance(obj, (list, tuple)):
        return [to_json_safe(x) for x in obj]
    if isinstance(obj, dict):
        return {str(k): to_json_safe(v) for k, v in obj.items()}
    return str(obj)

json.dumps({k: to_json_safe(v) for k, v in _locals.items()})
      `);
      currentVars = JSON.parse(vars);
    } catch(e) {
      currentVars = {};
    }
    
    if (currentOutput.trim()) {
      consoleEl.innerHTML = `<div class="console-output">${escapeHtml(currentOutput)}</div>`;
    } else {
      consoleEl.innerHTML = '<div class="console-info">✓ Код выполнен успешно (без вывода)</div>';
    }
  } catch(e) {
    consoleEl.innerHTML = `<div class="console-error">❌ ${escapeHtml(e.message)}</div>`;
  }
}

async function checkSolution() {
  const lesson = lessons.find(l => l.id === currentLessonId);
  if (!lesson) return;
  
  // Сначала запускаем код
  await runCode();
  
  const testsList = document.getElementById('testsList');
  let allPassed = true;
  const results = [];
  
  for (const test of lesson.tests) {
    try {
      const passed = test.check(currentOutput, currentVars, currentCode);
      results.push({ desc: test.desc, passed });
      if (!passed) allPassed = false;
    } catch(e) {
      results.push({ desc: test.desc, passed: false });
      allPassed = false;
    }
  }
  
  testsList.innerHTML = results.map(r => 
    `<div class="test-item ${r.passed ? 'pass' : 'fail'}">
      ${r.passed ? '✓' : '✗'} ${r.desc}
    </div>`
  ).join('');
  
  if (allPassed) {
    completedLessons.add(currentLessonId);
    saveProgress();
    renderSidebar();
    
    const consoleEl = document.getElementById('console');
    consoleEl.innerHTML += '<div class="console-info" style="margin-top: 10px; padding: 10px; background: rgba(0,117,42,0.2); border-radius: 4px;">🎉 Отлично! Все тесты пройдены. Урок завершён!</div>';
    
    if (currentLessonId < lessons.length) {
      setTimeout(() => {
        if (confirm('Все тесты пройдены! Перейти к следующему уроку?')) {
          loadLesson(currentLessonId + 1);
        }
      }, 800);
    } else {
      setTimeout(() => {
        alert('🎓 Поздравляем! Вы прошли весь курс! Нажмите на "Сертификат" в шапке, чтобы получить свой сертификат.');
      }, 500);
    }
  }
}

function resetCode() {
  const lesson = lessons.find(l => l.id === currentLessonId);
  if (lesson) {
    document.getElementById('codeEditor').value = lesson.initialCode;
    document.getElementById('console').innerHTML = '<div class="console-info">Код сброшен</div>';
  }
}

function showHint() {
  const lesson = lessons.find(l => l.id === currentLessonId);
  if (!lesson) return;
  
  const hints = {
    1: "Используйте print(\"Hello, PyCamp!\") — обратите внимание на регистр и восклицательный знак.",
    2: "Создайте переменные: name = \"Python\", version = 3, is_fun = True. Затем print(name), print(version), print(is_fun).",
    3: "Используйте print(17 + 25), print(6 * 7), print(17 % 5), print(2 ** 10).",
    4: "Используйте f-строку: print(f\"Имя: {first_name} {last_name}\").",
    5: "Используйте if temperature > 30: ... elif temperature >= 20: ... else: ...",
    6: "Вариант 1: for i in range(2, 21, 2): print(i). Вариант 2: for i in range(1, 11): print(i * 2).",
    7: "Используйте numbers.sort() или sorted(numbers), затем print(numbers) и print(sum(numbers)).",
    8: "student = {\"name\": \"Иван\", \"age\": 20, \"grade\": \"A\"}. Перебирайте: for k, v in student.items(): print(f\"{k}: {v}\").",
    9: "Распаковка: x, y, z = point. Затем print(x + y + z).",
    10: "Рекурсия: if n <= 1: return 1; else: return n * factorial(n-1). Или используйте цикл.",
    11: "result = list(filter(lambda x: x % 3 == 0, numbers)); print(result).",
    12: "try: return a / b; except ZeroDivisionError: return \"Ошибка: деление на ноль\".",
    13: "return len(text.split()) — split() делит строку по пробелам.",
    14: "area: return self.width * self.height; perimeter: return 2 * (self.width + self.height).",
    15: "Circle: return 3.14159 * self.radius ** 2; Square: return self.side ** 2.",
    16: "print(round(math.pi, 4)); print(math.sin(math.radians(90))); print(math.factorial(7)).",
    17: "def wrapper(*args, **kwargs): result = func(*args, **kwargs); return result.upper() if isinstance(result, str) else result; return wrapper.",
    18: "a, b = 0, 1; while True: yield a; a, b = b, a + b. Выведите 10 раз через цикл.",
    19: "return re.findall(r'[\\w.]+@[\\w.]+\\.[\\w.]+', text) — шаблон для email.",
    20: "return {\"average\": round(sum(grades)/len(grades), 2), \"max\": max(grades), \"min\": min(grades), \"passed\": sum(1 for g in grades if g >= 60)}."
  };
  
  alert("💡 Подсказка:\n\n" + (hints[currentLessonId] || "Попробуйте разобрать задачу на мелкие шаги."));
}

function showCertificate() {
  if (completedLessons.size < lessons.length) {
    alert(`Для получения сертификата необходимо завершить все уроки. Сейчас пройдено: ${completedLessons.size} из ${lessons.length}.`);
    return;
  }
  
  const name = prompt("Введите ваше имя для сертификата:") || "Студент PyCamp";
  document.getElementById('certName').textContent = name;
  document.getElementById('certDate').textContent = new Date().toLocaleDateString('ru-RU', { 
    year: 'numeric', month: 'long', day: 'numeric' 
  });
  document.getElementById('certModal').classList.add('active');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Обработка Tab в редакторе
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'codeEditor' && e.key === 'Tab') {
    e.preventDefault();
    const start = e.target.selectionStart;
    const end = e.target.selectionEnd;
    e.target.value = e.target.value.substring(0, start) + '    ' + e.target.value.substring(end);
    e.target.selectionStart = e.target.selectionEnd = start + 4;
  }
});

// Запуск
loadProgress();
initPyodide();
</script>
