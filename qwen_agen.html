<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyCodeCamp — Бесплатный курс Python</title>
  <script>
    (function () {
      var reported = {};
      window.addEventListener("error", function (event) {
        if (!event || !event.message) return;
        var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
        if (reported[key]) return;
        reported[key] = true;
        try {
          window.parent.postMessage({
            type: "sandbox-runtime-error",
            payload: {
              message: String(event.message).slice(0, 500),
              filename: event.filename || "",
              lineno: event.lineno || 0,
              colno: event.colno || 0,
              stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
            }
          }, "*");
        } catch (e) {}
      });
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a1a;
      color: #e2e8f0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #718096; }
    ::selection { background: rgba(72,187,120,0.3); }

    .header {
      background: linear-gradient(135deg, #166534, #15803d, #059669);
      color: white;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 24px; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .header-badge {
      background: rgba(0,0,0,0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
    .hamburger {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .hamburger:hover { background: rgba(255,255,255,0.1); }

    .progress-container { flex: 1; max-width: 300px; margin: 0 20px; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
    .progress-bar { width: 100%; height: 10px; background: rgba(0,0,0,0.3); border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #34d399); border-radius: 5px; transition: width 0.5s ease; }

    .layout { display: flex; max-width: 1400px; margin: 0 auto; }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background: #111827;
      border-right: 1px solid #1f2937;
      height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
      overflow-y: auto;
      padding: 16px;
    }
    .sidebar-section { margin-bottom: 8px; }
    .sidebar-section-btn {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: none;
      color: #d1d5db;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .sidebar-section-btn:hover { background: #1f2937; }
    .sidebar-section-btn.active { background: rgba(22,101,52,0.4); color: #86efac; border: 1px solid #166534; }
    .sidebar-section-icon { font-size: 18px; }
    .sidebar-section-count { margin-left: auto; font-size: 11px; color: #6b7280; }
    .sidebar-lessons { margin-left: 16px; margin-top: 4px; border-left: 2px solid #374151; padding-left: 12px; }
    .sidebar-lesson-btn {
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: none;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      margin-bottom: 2px;
    }
    .sidebar-lesson-btn:hover { background: #1f2937; color: #e5e7eb; }
    .sidebar-lesson-btn.active { color: #86efac; background: rgba(22,101,52,0.2); }
    .lesson-indicator {
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      border: 2px solid #4b5563;
      flex-shrink: 0;
    }
    .lesson-indicator.completed { background: #16a34a; border-color: #16a34a; color: white; }
    .lesson-indicator.current { border-color: #22c55e; }

    .main { flex: 1; min-width: 0; padding: 32px; }
    .breadcrumb { font-size: 13px; color: #6b7280; margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    .breadcrumb-current { color: #d1d5db; }
    .lesson-title { font-size: 28px; font-weight: 700; color: white; margin-bottom: 8px; }
    .lesson-complete-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: #16a34a; color: white; padding: 4px 12px;
      border-radius: 20px; font-size: 13px; margin-bottom: 24px;
    }

    .theory-block {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .theory-title { font-size: 16px; font-weight: 600; color: #4ade80; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .theory-content { color: #d1d5db; line-height: 1.7; font-size: 15px; }
    .theory-content p { margin-bottom: 8px; }
    .theory-content strong { color: white; }
    .theory-content code {
      background: #1f2937;
      color: #86efac;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }
    .theory-content .code-block {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      color: #e6edf3;
    }

    .examples-section { margin-bottom: 32px; }
    .examples-title { font-size: 16px; font-weight: 600; color: #facc15; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .example-item { margin-bottom: 24px; }
    .example-title { font-size: 13px; color: #9ca3af; margin-bottom: 8px; font-weight: 500; }
    .example-explanation { font-size: 13px; color: #6b7280; margin-top: 8px; font-style: italic; }

    .code-block-wrapper {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0;
    }
    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .code-block-lang { font-size: 11px; color: #8b949e; font-family: monospace; }
    .code-copy-btn {
      font-size: 11px;
      color: #8b949e;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .code-copy-btn:hover { background: #30363d; color: white; }
    .code-block-content {
      padding: 16px;
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      color: #e6edf3;
    }
    .code-block-content .kw { color: #c084fc; font-weight: 600; }
    .code-block-content .str { color: #fbbf24; }
    .code-block-content .num { color: #67e8f9; }
    .code-block-content .cmt { color: #4ade80; font-style: italic; }
    .code-block-content .dec { color: #fde047; }
    .code-block-content .fn { color: #60a5fa; }
    .code-block-content .bi { color: #f472b6; }

    .exercises-section { margin-bottom: 32px; }
    .exercises-title { font-size: 16px; font-weight: 600; color: #22d3ee; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .exercise-counter { font-size: 13px; color: #6b7280; font-weight: 400; }
    .exercise-block {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
    }
    .exercise-name { font-size: 16px; font-weight: 600; color: white; margin-bottom: 8px; }
    .exercise-desc { font-size: 14px; color: #9ca3af; margin-bottom: 16px; line-height: 1.5; }

    .editor-wrapper {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
    }
    .editor-header {
      padding: 8px 16px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      font-size: 12px;
      color: #8b949e;
      font-family: monospace;
    }
    .editor-textarea {
      width: 100%;
      min-height: 150px;
      padding: 16px;
      background: #0d1117;
      color: #86efac;
      border: none;
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      tab-size: 4;
    }
    .editor-textarea::placeholder { color: #4b5563; }

    .btn {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-run { background: #16a34a; color: white; }
    .btn-run:hover { background: #22c55e; }
    .btn-hint { background: rgba(234,179,8,0.15); color: #fde047; border: 1px solid rgba(234,179,8,0.3); }
    .btn-hint:hover { background: rgba(234,179,8,0.25); }
    .btn-solution { background: rgba(147,51,234,0.15); color: #d8b4fe; border: 1px solid rgba(147,51,234,0.3); }
    .btn-solution:hover { background: rgba(147,51,234,0.25); }
    .btn-nav { background: #1f2937; color: #d1d5db; }
    .btn-nav:hover { background: #374151; }
    .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-complete { background: #16a34a; color: white; }
    .btn-complete:hover { background: #22c55e; }
    .btn-complete.done { background: #15803d; cursor: default; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

    .hint-block {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(234,179,8,0.1);
      border: 1px solid rgba(234,179,8,0.3);
      border-radius: 8px;
      color: #fde047;
      font-size: 14px;
    }
    .solution-block { margin-top: 16px; }
    .solution-label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }

    .test-results { margin-top: 16px; }
    .test-results-title { font-size: 13px; color: #d1d5db; font-weight: 500; margin-bottom: 8px; }
    .test-result-item {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      white-space: pre-line;
      margin-bottom: 8px;
    }
    .test-pass { background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.3); color: #86efac; }
    .test-fail { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; }
    .test-success {
      margin-top: 12px;
      padding: 12px;
      background: rgba(22,163,74,0.15);
      border: 1px solid #16a34a;
      border-radius: 8px;
      text-align: center;
      color: #86efac;
      font-weight: 500;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid #1f2937;
      margin-top: 32px;
    }

    .footer {
      background: #111827;
      border-top: 1px solid #1f2937;
      padding: 32px 20px;
      text-align: center;
      margin-top: 48px;
    }
    .footer-logo { font-size: 24px; margin-bottom: 8px; }
    .footer-title { font-size: 20px; font-weight: 700; color: #4ade80; margin-bottom: 8px; }
    .footer-text { font-size: 13px; color: #6b7280; }
    .footer-sub { font-size: 11px; color: #4b5563; margin-top: 8px; }

    .mobile-progress {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #111827;
      border-top: 1px solid #1f2937;
      padding: 10px 16px;
      z-index: 50;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 89;
    }

    @media (max-width: 1024px) {
      .hamburger { display: block; }
      .sidebar {
        position: fixed;
        left: 0; top: 56px;
        z-index: 90;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .progress-container { display: none; }
      .mobile-progress { display: block; }
      .main { padding: 20px 16px 80px; }
      .footer { margin-bottom: 50px; }
    }
    @media (max-width: 640px) {
      .lesson-title { font-size: 22px; }
      .header-title { font-size: 16px; }
      .btn { padding: 6px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="header-logo">🐍</span>
      <span class="header-title">PyCodeCamp</span>
    </div>
    <div class="progress-container" id="headerProgress"></div>
    <div class="header-badge" id="headerBadge">⭐ 0 / 0</div>
  </header>

  <div class="layout">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="mainContent"></main>
  </div>

  <div class="mobile-progress" id="mobileProgress"></div>

  <footer class="footer">
    <div class="footer-logo">🐍</div>
    <div class="footer-title">PyCodeCamp</div>
    <div class="footer-text" id="footerText"></div>
    <div class="footer-sub">Вдохновлено freeCodeCamp • Учитесь программировать бесплатно</div>
  </footer>

  <script>
    // ==================== COURSE DATA ====================
    const courseData = [
      {
        id: 'intro', title: 'Введение в Python', icon: '🐍',
        lessons: [
          {
            id: 'intro-1', title: 'Что такое Python?',
            theory: `Python — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом и впервые выпущенный в 1991 году.\n\n**Почему Python популярен:**\n- Простой и читаемый синтаксис\n- Огромная стандартная библиотека\n- Активное сообщество\n- Применим в веб-разработке, науке о данных, ИИ, автоматизации\n\n**Особенности Python:**\n- Интерпретируемый язык (не требует компиляции)\n- Динамическая типизация\n- Автоматическое управление памятью\n- Поддержка множественных парадигм (ООП, функциональное, процедурное)\n\nPython использует отступы для определения блоков кода вместо фигурных скобок.`,
            examples: [
              { title: 'Первая программа', code: 'print("Привет, мир!")\nprint("Добро пожаловать в Python!")', explanation: 'Функция print() выводит текст на экран. Текст в кавычках называется строкой (string).' },
              { title: 'Python как калькулятор', code: 'print(2 + 3)\nprint(10 - 4)\nprint(6 * 7)\nprint(15 / 3)', explanation: 'Python может выполнять математические операции: + (сложение), - (вычитание), * (умножение), / (деление).' }
            ],
            exercises: [
              { title: 'Приветствие', description: 'Напишите программу, которая выводит "Hello, Python!"', starterCode: '# Напишите ваш код здесь\n', solution: 'print("Hello, Python!")', hint: 'Используйте функцию print() с текстом в кавычках', tests: [{ expected: 'Hello, Python!', description: 'Выводит "Hello, Python!"' }] }
            ]
          },
          {
            id: 'intro-2', title: 'Установка и среда разработки',
            theory: `Для начала работы с Python вам нужно:\n\n**1. Установить Python:**\n- Скачайте с python.org\n- Выберите версию 3.10 или новее\n- При установке на Windows отметьте "Add Python to PATH"\n\n**2. Выбрать редактор кода:**\n- **VS Code** — бесплатный, мощный, с расширениями для Python\n- **PyCharm** — специализированная IDE для Python\n- **Jupyter Notebook** — для научных вычислений и анализа данных\n\n**3. Запуск программ:**\n- Через терминал: \`python program.py\`\n- Через интерактивный режим: \`python\` (REPL)\n- Через IDE — кнопкой "Run"\n\n**Виртуальные окружения:**\n\`\`\`\npython -m venv myenv\nsource myenv/bin/activate  # Linux/Mac\nmyenv\\Scripts\\activate     # Windows\n\`\`\``,
            examples: [
              { title: 'Создание файла программы', code: '# Файл: hello.py\nprint("Моя первая программа!")\nprint("Python работает!")', explanation: 'Сохраните код в файл с расширением .py и запустите командой python hello.py' }
            ],
            exercises: [
              { title: 'Множественный вывод', description: 'Выведите три строки: "Строка 1", "Строка 2", "Строка 3" — каждую с новой строки', starterCode: '# Выведите три строки\n', solution: 'print("Строка 1")\nprint("Строка 2")\nprint("Строка 3")', hint: 'Используйте три вызова print()', tests: [{ expected: 'Строка 1\nСтрока 2\nСтрока 3', description: 'Выводит три строки' }] }
            ]
          }
        ]
      },
      {
        id: 'variables', title: 'Переменные и типы данных', icon: '📦',
        lessons: [
          {
            id: 'var-1', title: 'Переменные',
            theory: `Переменная — это именованная область памяти для хранения данных. В Python не нужно объявлять тип переменной заранее.\n\n**Правила именования переменных:**\n- Начинаются с буквы или символа подчёркивания\n- Содержат буквы, цифры и символы подчёркивания\n- Регистрозависимы (name ≠ Name)\n- Нельзя использовать зарезервированные слова (if, for, class и т.д.)\n\n**Соглашения:**\n- Используйте snake_case: my_variable, user_name\n- Имена должны быть осмысленными\n\n**Присваивание:**\n\`\`\`\nx = 10        # целое число\nname = "Анна" # строка\npi = 3.14     # дробное число\n\`\`\``,
            examples: [
              { title: 'Создание переменных', code: 'name = "Алексей"\nage = 25\ncity = "Москва"\n\nprint(name)\nprint(age)\nprint(city)', explanation: 'Мы создали три переменные разных типов и вывели их значения.' },
              { title: 'Множественное присваивание', code: 'x, y, z = 1, 2, 3\na = b = c = 0\n\nprint(x, y, z)\nprint(a, b, c)', explanation: 'Python позволяет присваивать значения нескольким переменным одновременно.' }
            ],
            exercises: [
              { title: 'Переменные', description: 'Создайте переменные name со значением "Python" и version со значением 3, затем выведите их', starterCode: '# Создайте переменные и выведите их\n', solution: 'name = "Python"\nversion = 3\nprint(name)\nprint(version)', hint: 'Используйте оператор = для присваивания значений', tests: [{ expected: 'Python\n3', description: 'Выводит name и version' }] }
            ]
          },
          {
            id: 'var-2', title: 'Числовые типы',

          var augAssign = line.match(/^(\w+)\s*(\+|-|\*|\/|\/\/|%)=\s*(.+)$/);
          if (augAssign) {
            var varName = augAssign[1];
            var op = augAssign[2];
            var expr = augAssign[3];
            var current = localVars[varName] !== undefined ? localVars[varName] : variables[varName];
            var val = evalExpr(expr, localVars);
            var result;
            switch(op) {
              case '+': result = typeof current === 'string' ? current + val : current + val; break;
              case '-': result = current - val; break;
              case '*': result = current * val; break;
              case '/': result = current / val; break;
              case '//': result = Math.floor(current / val); break;
              case '%': result = current % val; break;
            }
            localVars[varName] = result;
            variables[varName] = result;
            i++; continue;
          }

          // If/elif/else
          if (line.startsWith('if ') || line.startsWith('elif ') || line === 'else:' || line.startsWith('else:')) {
            var condition = true;
            if (line.startsWith('if ') || line.startsWith('elif ')) {
              var condExpr = line.replace(/^(if|elif)\s+/, '').replace(/:$/, '');
              condition = evalCondition(condExpr, localVars);
            }
            var baseIndent = getIndent(blockLines[i]);
            var block = [];
            i++;
            while (i < blockLines.length) {
              var nextLine = blockLines[i];
              if (nextLine.trim() === '' || nextLine.trim().startsWith('#')) { i++; continue; }
              var nextIndent = getIndent(nextLine);
              if (nextIndent > baseIndent) { block.push(nextLine); i++; }
              else break;
            }
            if (condition) {
              executeBlock(block, localVars);
              while (i < blockLines.length) {
                var nextLine = blockLines[i].trim();
                if (nextLine.startsWith('elif ') || nextLine.startsWith('else')) {
                  var bi = getIndent(blockLines[i]);
                  i++;
                  while (i < blockLines.length && getIndent(blockLines[i]) > bi) i++;
                } else break;
              }
              continue;
            } else {
              continue;
            }
          }

          // For loop
          var forMatch = line.match(/^for\s+(.+)\s+in\s+(.+):$/);
          if (forMatch) {
            var loopVars = forMatch[1];
            var iterExpr = forMatch[2];
            var items = evaluateIterable(iterExpr, localVars);
            var vars = loopVars.split(',').map(function(v) { return v.trim(); });
            var baseIndent = getIndent(blockLines[i]);
            var block = [];
            i++;
            while (i < blockLines.length) {
              var nextLine = blockLines[i];
              if (nextLine.trim() === '') { i++; continue; }
              var nextIndent = getIndent(nextLine);
              if (nextIndent > baseIndent) { block.push(nextLine); i++; }
              else break;
            }
            for (var ii = 0; ii < items.length; ii++) {
              var item = items[ii];
              var loopLocal = {};
              for (var k in localVars) loopLocal[k] = localVars[k];
              if (vars.length === 1) {
                loopLocal[vars[0]] = item;
              } else if (Array.isArray(item)) {
                for (var vi = 0; vi < vars.length; vi++) loopLocal[vars[vi]] = item[vi];
              } else {
                loopLocal[vars[0]] = item;
              }
              executeBlock(block, loopLocal);
            }
            continue;
          }

          // While loop
          var whileMatch = line.match(/^while\s+(.+):$/);
          if (whileMatch) {
            var condExpr = whileMatch[1];
            var baseIndent = getIndent(blockLines[i]);
            var block = [];
            i++;
            while (i < blockLines.length) {
              var nextLine = blockLines[i];
              if (nextLine.trim() === '') { i++; continue; }
              var nextIndent = getIndent(nextLine);
              if (nextIndent > baseIndent) { block.push(nextLine); i++; }
              else break;
            }
            var maxIter = 1000;
            while (evalCondition(condExpr, localVars) && maxIter-- > 0) {
              executeBlock(block, localVars);
            }
            continue;
          }

          // Function definition
          var defMatch = line.match(/^def\s+(\w+)\s*\(([^)]*)\)\s*:$/);
          if (defMatch) {
            var funcName = defMatch[1];
            var paramsStr = defMatch[2];
            var params = [];
            var defaults = {};
            if (paramsStr.trim()) {
              var paramParts = paramsStr.split(',');
              for (var pi = 0; pi < paramParts.length; pi++) {
                var pp = paramParts[pi].trim();
                if (pp.includes('=')) {
                  var eqParts = pp.split('=');
                  params.push(eqParts[0].trim());
                  defaults[eqParts[0].trim()] = evalExpr(eqParts[1].trim(), localVars);
                } else if (pp.startsWith('*')) {
                  params.push(pp);
                } else {
                  params.push(pp);
                }
              }
            }
            var baseIndent = getIndent(blockLines[i]);
            var body = [];
            i++;
            while (i < blockLines.length) {
              var nextLine = blockLines[i];
              if (nextLine.trim() === '') { i++; continue; }
              var nextIndent = getIndent(nextLine);
              if (nextIndent > baseIndent) { body.push(nextLine); i++; }
              else break;
            }
            functions[funcName] = { params: params, defaults: defaults, body: body };
            continue;
          }

          // Class definition
          var classMatch = line.match(/^class\s+(\w+)(?:\((\w+)\))?\s*:$/);
          if (classMatch) {
            var className = classMatch[1];
            var parent = classMatch[2];
            var baseIndent = getIndent(blockLines[i]);
            var body = [];
            i++;
            while (i < blockLines.length) {
              var nextLine = blockLines[i];
              if (nextLine.trim() === '') { i++; continue; }
              var nextIndent = getIndent(nextLine);
              if (nextIndent > baseIndent) { body.push(nextLine); i++; }
              else break;
            }
            var cls = { parent: parent, methods: {}, classAttrs: {} };
            for (var j = 0; j < body.length; j++) {
              var mLine = body[j].trim();
              var mDef = mLine.match(/^def\s+(\w+)\s*\(([^)]*)\)\s*:$/);
              if (mDef) {
                var mName = mDef[1];
                var mParams = mDef[2].split(',').map(function(p) { return p.trim(); }).filter(Boolean);
                var mBaseIndent = getIndent(body[j]);
                var mBody = [];
                j++;
                while (j < body.length) {
                  var nextLine = body[j];
                  if (nextLine.trim() === '') { j++; continue; }
                  var nextIndent = getIndent(nextLine);
                  if (nextIndent > mBaseIndent) { mBody.push(nextLine); j++; }
                  else { j--; break; }
                }
                cls.methods[mName] = { params: mParams, body: mBody };
              } else if (mLine.includes('=') && !mLine.startsWith('def') && !mLine.startsWith('#') && !mLine.startsWith('"""')) {
                var attrMatch = mLine.match(/^(\w+)\s*=\s*(.+)$/);
                if (attrMatch) cls.classAttrs[attrMatch[1]] = evalExpr(attrMatch[2]);
              }
            }
            classes[className] = cls;
            continue;
          }

          // Object instantiation
          var instMatch = line.match(/^(\w+)\s*=\s*(\w+)\((.+)\)$/);
          if (instMatch && classes[instMatch[2]]) {
            var varName = instMatch[1];
            var className = instMatch[2];
            var argsStr = instMatch[3];
            var cls = classes[className];
            var args = parseArgs(argsStr, localVars);
            var obj = { __class__: className };
            for (var k in cls.classAttrs) obj[k] = cls.classAttrs[k];
            if (cls.methods['__init__']) {
              var init = cls.methods['__init__'];
              var initLocals = { self: obj };
              for (var pi = 1; pi < init.params.length; pi++) {
                initLocals[init.params[pi]] = args[pi - 1];
              }
              executeBlock(init.body, initLocals);
              obj = initLocals.self;
            }
            localVars[varName] = obj;
            variables[varName] = obj;
            i++; continue;
          }

          // Method call on object
          var methodCallMatch = line.match(/^(\w+)\.(\w+)\((.*)?\)$/);
          if (methodCallMatch && !functions[methodCallMatch[1]]) {
            var objName = methodCallMatch[1];
            var method = methodCallMatch[2];
            var argsStr = methodCallMatch[3] || '';
            var obj = localVars[objName] !== undefined ? localVars[objName] : variables[objName];
            if (obj && obj.__class__ && classes[obj.__class__]) {
              var cls = classes[obj.__class__];
              if (cls.methods[method]) {
                var m = cls.methods[method];
                var args = argsStr ? parseArgs(argsStr, localVars) : [];
                var mLocals = { self: obj };
                for (var pi = 1; pi < m.params.length; pi++) {
                  mLocals[m.params[pi]] = args[pi - 1];
                }
                executeBlock(m.body, mLocals);
                if (localVars[objName] !== undefined) localVars[objName] = mLocals.self;
                else variables[objName] = mLocals.self;
              }
            }
            i++; continue;
          }

          // Standalone function call
          var funcCallMatch = line.match(/^(\w+)\((.*)?\)$/);
          if (funcCallMatch && functions[funcCallMatch[1]]) {
            evalExpr(line, localVars);
            i++; continue;
          }

          // Try-except
          if (line === 'try:') {
            var baseIndent = getIndent(blockLines[i]);
            var tryBlock = [];
            i++;
            while (i < blockLines.length) {
              var nextLine = blockLines[i];
              if (nextLine.trim() === '') { i++; continue; }
              var nextIndent = getIndent(nextLine);
              if (nextIndent > baseIndent) { tryBlock.push(nextLine); i++; }
              else break;
            }
            var exceptBlocks = [];
            while (i < blockLines.length && blockLines[i].trim().startsWith('except')) {
              var exceptLine = blockLines[i].trim();
              var exceptType = (exceptLine.match(/^except\s+(\w+)/) || [,'Exception'])[1];
              var eIndent = getIndent(blockLines[i]);
              var eBlock = [];
              i++;
              while (i < blockLines.length) {
                var nextLine = blockLines[i];
                if (nextLine.trim() === '') { i++; continue; }
                var nextIndent = getIndent(nextLine);
                if (nextIndent > eIndent) { eBlock.push(nextLine); i++; }
                else break;
              }
              exceptBlocks.push({ type: exceptType, body: eBlock });
            }
            // Skip finally
            if (i < blockLines.length && blockLines[i].trim().startsWith('finally')) {
              var fIndent = getIndent(blockLines[i]);
              i++;
              while (i < blockLines.length) {
                var nextLine = blockLines[i];
                if (nextLine.trim() === '') { i++; continue; }
                if (getIndent(nextLine) > fIndent) i++;
                else break;
              }
            }
            try {
              executeBlock(tryBlock, localVars);
            } catch(e) {
              for (var ei = 0; ei < exceptBlocks.length; ei++) {
                var eb = exceptBlocks[ei];
                if (eb.type === 'Exception' || e.message && e.message.includes(eb.type)) {
                  executeBlock(eb.body, localVars);
                  break;
                }
              }
            }
            continue;
          }

          // Return
          if (line.startsWith('return')) {
            var retVal = line === 'return' ? null : evalExpr(line.replace(/^return\s*/, ''), localVars);
            return retVal;
          }

          // Raise
          if (line.startsWith('raise ')) {
            var errMatch = line.match(/^raise\s+(\w+)\((.+)\)$/);
            if (errMatch) {
              throw { name: errMatch[1], message: evalExpr(errMatch[2], localVars) };
            }
            throw new Error(line);
          }

          i++;
        }
      }

      function formatValue(val) {
        if (val === null || val === undefined) return 'None';
        if (val === true) return 'True';
        if (val === false) return 'False';
        if (Array.isArray(val)) return '[' + val.map(formatValue).join(', ') + ']';
        if (typeof val === 'object') return JSON.stringify(val);
        return String(val);
      }

      try {
        executeBlock(lines, {});
      } catch(e) {
        if (e.name && e.message) {
          output.push(e.name + ': ' + e.message);
        } else {
          output.push('Error: ' + (e.message || String(e)));
        }
      }

      return output.join('\n').replace(/\n+$/, '');
    }

    // ==================== RENDER ====================
    function render() {
      renderSidebar();
      renderMainContent();
      renderProgress();
    }

    function renderProgress() {
      var total = getTotalLessons();
      var completed = state.completedLessons.size;
      var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
      var html = '<div class="progress-labels"><span>Прогресс курса</span><span>' + completed + '/' + total + ' уроков (' + pct + '%)</span></div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
      document.getElementById('headerProgress').innerHTML = html;
      document.getElementById('mobileProgress').innerHTML = html;
      document.getElementById('headerBadge').textContent = '⭐ ' + completed + ' / ' + total;
      document.getElementById('footerText').textContent = 'Бесплатный интерактивный курс Python • ' + total + ' уроков • ' + courseData.length + ' разделов';
    }

    function renderSidebar() {
      var sidebar = document.getElementById('sidebar');
      var html = '<nav>';
      courseData.forEach(function(section, sIdx) {
        var isActive = sIdx === state.activeSection;
        var completedCount = section.lessons.filter(function(l) { return state.completedLessons.has(l.id); }).length;
        html += '<div class="sidebar-section">' +
          '<button class="sidebar-section-btn ' + (isActive ? 'active' : '') + '" onclick="selectSection(' + sIdx + ')">' +
            '<span class="sidebar-section-icon">' + section.icon + '</span>' +
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + section.title + '</span>' +
            '<span class="sidebar-section-count">' + completedCount + '/' + section.lessons.length + '</span>' +
          '</button>';
        if (isActive) {
          html += '<div class="sidebar-lessons">';
          section.lessons.forEach(function(lesson, lIdx) {
            var isLessonActive = lIdx === state.activeLesson;
            var isCompleted = state.completedLessons.has(lesson.id);
            html += '<button class="sidebar-lesson-btn ' + (isLessonActive ? 'active' : '') + '" onclick="selectLesson(' + sIdx + ',' + lIdx + ')">' +
              '<span class="lesson-indicator ' + (isCompleted ? 'completed' : '') + ' ' + (isLessonActive ? 'current' : '') + '">' + (isCompleted ? '✓' : (lIdx + 1)) + '</span>' +
              '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + lesson.title + '</span>' +
            '</button>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</nav>';
      sidebar.innerHTML = html;
    }

    function renderMainContent() {
      var section = courseData[state.activeSection];
      var lesson = section.lessons[state.activeLesson];
      var exercise = lesson.exercises[state.activeExercise];
      var isCompleted = state.completedLessons.has(lesson.id);

      if (!state.editorCode || state._lastKey !== state.activeSection + '-' + state.activeLesson + '-' + state.activeExercise) {
        state.editorCode = exercise.starterCode;
        state._lastKey = state.activeSection + '-' + state.activeLesson + '-' + state.activeExercise;
        state.showSolution = false;
        state.showHint = false;
        state.testResults = null;
      }

      var html = '';
      html += '<div class="breadcrumb"><span>' + section.icon + ' ' + section.title + '</span><span>/</span><span class="breadcrumb-current">' + lesson.title + '</span></div>';
      html += '<h2 class="lesson-title">' + lesson.title + '</h2>';
      if (isCompleted) html += '<div class="lesson-complete-badge">✅ Завершено</div>';

      html += '<div class="theory-block"><div class="theory-title">📖 Теория</div><div class="theory-content">' + renderTheory(lesson.theory) + '</div></div>';

      html += '<div class="examples-section"><div class="examples-title">💡 Примеры</div>';
      lesson.examples.forEach(function(ex) {
        html += '<div class="example-item"><div class="example-title">' + ex.title + '</div>' + renderCodeBlock(ex.code) + '<div class="example-explanation">' + ex.explanation + '</div></div>';
      });
      html += '</div>';

      if (lesson.exercises.length > 0) {
        html += '<div class="exercises-section"><div class="exercises-title">🎯 Задания <span class="exercise-counter">(' + (state.activeExercise + 1) + ' из ' + lesson.exercises.length + ')</span></div>';
        html += '<div class="exercise-block">';
        html += '<div class="exercise-name">' + exercise.title + '</div>';
        html += '<div class="exercise-desc">' + exercise.description + '</div>';
        if (lesson.exercises.length > 1) {
          html += '<div style="display:flex;gap:8px;margin-bottom:16px;">';
          lesson.exercises.forEach(function(_, i) {
            html += '<button class="btn ' + (i === state.activeExercise ? 'btn-run' : 'btn-nav') + '" onclick="selectExercise(' + i + ')" style="padding:4px 12px;font-size:12px;">Задание ' + (i + 1) + '</button>';
          });
          html += '</div>';
        }
        html += '<div class="editor-wrapper"><div class="editor-header">🐍 Редактор Python</div>';
        html += '<textarea class="editor-textarea" id="codeEditor" spellcheck="false" placeholder="# Напишите ваш код здесь..." oninput="state.editorCode=this.value">' + escapeHtml(state.editorCode) + '</textarea></div>';
        html += '<div class="btn-group">';
        html += '<button class="btn btn-run" onclick="runCode()">▶ Запустить</button>';
        html += '<button class="btn btn-hint" onclick="toggleHint()">💡 Подсказка</button>';
        html += '<button class="btn btn-solution" onclick="toggleSolution()">👁 Решение</button>';
        html += '</div>';
        if (state.showHint) html += '<div class="hint-block">💡 ' + exercise.hint + '</div>';
        if (state.showSolution) html += '<div class="solution-block"><div class="solution-label">Решение:</div>' + renderCodeBlock(exercise.solution) + '</div>';
        if (state.testResults) {
          html += '<div class="test-results"><div class="test-results-title">Результаты тестов:</div>';
          state.testResults.forEach(function(r) {
            html += '<div class="test-result-item ' + (r.passed ? 'test-pass' : 'test-fail') + '">' + escapeHtml(r.output) + '</div>';
          });
          if (state.testResults.every(function(r) { return r.passed; })) {
            html += '<div class="test-success">🎉 Отлично! Все тесты пройдены!</div>';
          }
          html += '</div>';
        }
        html += '</div></div>';
      }

      var isFirst = state.activeSection === 0 && state.activeLesson === 0 && state.activeExercise === 0;
      var isLast = state.activeSection === courseData.length - 1 && state.activeLesson === section.lessons.length - 1 && state.activeExercise === lesson.exercises.length - 1;
      html += '<div class="nav-bar">';
      html += '<button class="btn btn-nav" onclick="goPrev()" ' + (isFirst ? 'disabled' : '') + '>← Назад</button>';
      html += '<button class="btn btn-complete ' + (isCompleted ? 'done' : '') + '" onclick="markComplete()">' + (isCompleted ? '✅ Завершено' : 'Отметить как пройденное') + '</button>';
      html += '<button class="btn btn-nav" onclick="goNext()" ' + (isLast ? 'disabled' : '') + '>Далее →</button>';
      html += '</div>';

      document.getElementById('mainContent').innerHTML = html;
    }

    // ==================== ACTIONS ====================
    function selectSection(idx) {
      state.activeSection = idx;
      state.activeLesson = 0;
      state.activeExercise = 0;
      state._lastKey = '';
      render();
    }

    function selectLesson(sIdx, lIdx) {
      state.activeSection = sIdx;
      state.activeLesson = lIdx;
      state.activeExercise = 0;
      state._lastKey = '';
      state.sidebarOpen = false;
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
      render();
      window.scrollTo(0, 0);
    }

    function selectExercise(idx) {
      state.activeExercise = idx;
      state._lastKey = '';
      render();
    }

    function toggleSidebar() {
      state.sidebarOpen = !state.sidebarOpen;
      document.getElementById('sidebar').classList.toggle('open', state.sidebarOpen);
      document.getElementById('sidebarOverlay').classList.toggle('open', state.sidebarOpen);
    }

    function toggleHint() {
      state.showHint = !state.showHint;
      render();
    }

    function toggleSolution() {
      state.showSolution = !state.showSolution;
      render();
    }

    function runCode() {
      var lesson = courseData[state.activeSection].lessons[state.activeLesson];
      var exercise = lesson.exercises[state.activeExercise];
      var userOutput = simulatePython(state.editorCode);
      var results = exercise.tests.map(function(test) {
        var passed = userOutput.trim() === test.expected.trim();
        return {
          passed: passed,
          output: passed ? '✅ Верно! Вывод: ' + userOutput : '❌ Ожидание: "' + test.expected + '"\n   Получено: "' + (userOutput || '(пусто)') + '"'
        };
      });
      state.testResults = results;
      if (results.every(function(r) { return r.passed; })) markComplete();
      render();
    }

    function markComplete() {
      var lesson = courseData[state.activeSection].lessons[state.activeLesson];
      state.completedLessons.add(lesson.id);
      saveProgress();
      render();
    }

    function goNext() {
      var section = courseData[state.activeSection];
      var lesson = section.lessons[state.activeLesson];
      if (state.activeExercise < lesson.exercises.length - 1) {
        state.activeExercise++;
      } else if (state.activeLesson < section.lessons.length - 1) {
        state.activeLesson++;
        state.activeExercise = 0;
      } else if (state.activeSection < courseData.length - 1) {
        state.activeSection++;
        state.activeLesson = 0;
        state.activeExercise = 0;
      }
      state._lastKey = '';
      render();
      window.scrollTo(0, 0);
    }

    function goPrev() {
      if (state.activeExercise > 0) {
        state.activeExercise--;
      } else if (state.activeLesson > 0) {
        state.activeLesson--;
        state.activeExercise = courseData[state.activeSection].lessons[state.activeLesson].exercises.length - 1;
      } else if (state.activeSection > 0) {
        state.activeSection--;
        var prevSection = courseData[state.activeSection];
        state.activeLesson = prevSection.lessons.length - 1;
        state.activeExercise = prevSection.lessons[state.activeLesson].exercises.length - 1;
      }
      state._lastKey = '';
      render();
      window.scrollTo(0, 0);
    }

    // ==================== INIT ====================
    render();
  </script>
</body>
</html>
